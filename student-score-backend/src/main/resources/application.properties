spring.application.name=student-score-backend

# Database Configuration - H2 In-Memory Database (Development)
spring.datasource.url=jdbc:h2:mem:student_score
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# H2 Console (for debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# SQL Init (use schema.sql for H2 development)
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# Flyway - disabled for H2 development, enable for MySQL production
spring.flyway.enabled=false

# MyBatis-Plus Configuration
mybatis-plus.mapper-locations=classpath*:/mapper/**/*.xml
mybatis-plus.type-aliases-package=com.ecommerce.studentscorebackend.entity
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# Server Configuration
server.port=8080
server.servlet.context-path=/api
